<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f9f8">
  <meta name="description" content="算法、面试场景与系统设计习题册：顺序练习、按难度随机抽题，保存代码与解题思路。">
  <title>一题一会</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=seal">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <div id="loading" class="loading-state" role="status"><span class="loading-line"></span><h1>正在打开你的题库</h1><p>准备题目与作答区…</p></div>
  <div id="load-error" class="loading-state" hidden><h1>题库暂时没有加载成功</h1><p id="load-error-message"></p><button id="retry-load" class="primary-button">重新加载</button><p><a href="#/">← 返回题库</a></p></div>

  <main id="bank-picker" class="bookshelf-page" hidden aria-label="选择习题册">
    <div class="bookshelf-home">
      <header class="bookshelf-intro">
        <h1>一题一会</h1>
        <p>从算法到系统设计，选一本，练一题。</p>
      </header>
      <div class="bookshelf"><div id="bank-options" class="book-collection"></div></div>
    </div>
  </main>

  <main id="mode-picker" class="mode-picker" hidden aria-label="练习模式">
    <div class="mode-picker-content">
      <a id="back-to-banks" class="picker-back" href="#/">← 题库</a>
      <div class="mode-options">
        <button id="ordered-mode" class="mode-option"><strong>顺序练习 <span aria-hidden="true">→</span></strong><span>按题单顺序，逐题练习</span></button>
        <button id="random-mode" class="mode-option"><strong>随机练习 <span aria-hidden="true">→</span></strong><span>随机抽一道题</span></button>
      </div>
    </div>
  </main>

  <div id="workspace" class="workspace" hidden>
    <aside class="sidebar" aria-label="题目目录">
      <div class="sidebar-heading"><h2>题目目录</h2><button id="toggle-catalog" class="catalog-toggle" aria-expanded="false">展开题目</button></div>
      <div class="catalog-body" id="catalog-body">
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索题名、编号或分类" aria-label="搜索题目" autocomplete="off"></label>
        <p id="catalog-caption" class="catalog-caption">按官方分类顺序排列</p>
        <nav id="question-list" class="question-list" aria-label="HOT 100 题目"></nav>
      </div>
      <div class="sidebar-bottom"><span>题库更新 <time id="data-date"></time></span><a id="bank-source" href="https://leetcode.cn/studyplan/top-100-liked/" target="_blank" rel="noopener noreferrer">官方题单 ↗</a></div>
    </aside>

    <main class="main-workspace">
      <section class="session-bar" aria-label="练习设置">
        <nav class="session-title" aria-label="练习导航"><a id="practice-bookshelf" href="#/" aria-label="返回书架">← 书架</a><span class="session-divider" aria-hidden="true">/</span><a id="back-to-modes" href="#/">选择模式</a><span class="session-divider" aria-hidden="true">/</span><span id="session-title" aria-current="page">顺序练习</span></nav>
        <div id="random-controls" class="random-controls" hidden><label for="difficulty">抽题难度</label><select id="difficulty"><option value="all">全部难度</option><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select><span id="pool-count"></span></div>
        <span id="order-label" class="order-label"></span>
      </section>

      <div class="mobile-tabs" role="group" aria-label="工作区视图"><button id="show-description" aria-pressed="true">题目描述</button><button id="show-editor" aria-pressed="false">代码编辑框</button></div>

      <div class="panels" id="panels">
        <section class="problem-panel" aria-labelledby="problem-title">
          <div class="panel-heading"><span><span class="small-icon" aria-hidden="true">▤</span> 题目描述</span><a id="source-link" target="_blank" rel="noopener noreferrer">力扣原题 ↗</a></div>
          <div class="problem-scroll" id="problem-scroll">
            <div class="problem-intro"><div class="breadcrumb"><span id="problem-category"></span><span>/</span><span id="problem-number"></span></div><h1 id="problem-title"></h1><p id="english-title" class="english-title"></p><div class="problem-meta"><span id="difficulty-badge" class="difficulty-badge"></span><span class="meta-divider"></span><span id="problem-tags"></span></div></div>
            <article id="problem-content" class="problem-content"></article>
          </div>
        </section>

        <section class="editor-panel" aria-label="代码草稿">
          <div class="panel-heading editor-heading"><span id="editor-heading-label"><span class="small-icon" aria-hidden="true">&lt;/&gt;</span> 代码草稿</span><div class="editor-settings"><select id="code-language" class="editor-language" aria-label="代码语言"></select><select id="editor-theme" class="editor-language" aria-label="草稿配色"><option value="light">浅色</option><option value="dark">深色</option></select></div></div>
          <div class="editor-toolbar"><span id="editor-file">Solution.java</span><div><button id="format-code" title="格式化当前代码">格式化</button><button id="reset-code" title="恢复这道题的初始 Java 模板">重置模板</button><button id="copy-code">复制代码</button></div></div>
          <div class="code-area"><pre id="line-numbers" class="line-numbers" aria-hidden="true">1</pre><div class="code-input"><pre id="code-highlight" aria-hidden="true"><code id="highlight-content"></code></pre><textarea id="code-editor" aria-label="Java 代码编辑框" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div></div>
          <div class="editor-status"><span id="save-status" role="status">草稿自动保存在此浏览器</span><span id="cursor-position">Ln 1, Col 1</span></div>
          <div class="editor-note"><span class="note-mark" aria-hidden="true">i</span><p id="editor-note-text">先独立写一遍，再去力扣验证。<span>此处仅编辑与保存代码，不执行或判题。</span></p><a id="verify-link" target="_blank" rel="noopener noreferrer">去验证 ↗</a></div>
        </section>
      </div>

      <footer class="navigation-bar"><div><button id="previous" class="secondary-button">← 上一题</button><button id="next" class="primary-button">下一题 →</button></div></footer>
    </main>
  </div>

  <dialog id="reset-dialog"><form method="dialog"><span class="eyebrow">RESET DRAFT</span><h2 id="reset-title">恢复初始模板？</h2><p id="reset-description"></p><div class="dialog-actions"><button value="cancel" class="secondary-button">保留草稿</button><button id="reset-confirm" value="confirm" class="primary-button">恢复模板</button></div></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>请启用 JavaScript，以使用题库、随机抽题和代码编辑框。</noscript>
</body>
</html>
